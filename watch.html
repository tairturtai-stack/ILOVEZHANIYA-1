<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ILOVEZHANIYA</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a0b;--panel:#181416;--line:#2a2326;--text:#f3eceb;--muted:#a1928f;--accent:#9b1c31;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
background-image:radial-gradient(800px 420px at 80% -10%,rgba(155,28,49,.28),transparent 60%)}
.wrap,.room{max-width:760px;margin:0 auto;padding:20px;display:grid;gap:14px}
.logo{font:700 15px Unbounded,sans-serif;display:flex;gap:10px;align-items:center}
.logo i{background:var(--accent);border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-size:13px}
h1{font:700 clamp(28px,6vw,44px)/1.1 Unbounded,sans-serif;margin:8px 0}.muted{color:var(--muted);margin:0}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;padding:13px 15px;min-width:0;width:100%}
#code{text-transform:uppercase;letter-spacing:.12em}
.btn{font:700 15px Manrope,sans-serif;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;color:#fff;white-space:nowrap}
.primary{background:var(--accent)}.ghost{background:transparent;border:1px solid var(--line)}.sm{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:#ff8a8a;margin:0;min-height:22px}
header{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line)}.ok{color:#3ecf8e}.bad{color:#ffb454}
#players{display:flex;gap:16px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}.dot.on{background:#3ecf8e}
video,#ytwrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px}#ytwrap iframe{width:100%;height:100%;border:0;border-radius:16px}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
#log{max-height:220px;overflow:auto}#log p{margin:0 0 8px}#log small{color:var(--muted)}
:focus-visible{outline:2px solid #c8283f;outline-offset:2px}
</style></head><body>
<main id="home" class="wrap">
 <div class="logo"><i>❤</i>ILOVEZHANIYA</div>
 <h1>Один фильм на двоих, даже на расстоянии</h1>
 <p class="muted">Создайте комнату, отправьте ссылку и включите фильм.</p>
 <input id="name" placeholder="Ваше имя" maxlength="24">
 <button class="btn primary" id="create">Создать комнату</button>
 <form class="row" id="joinForm"><input id="code" placeholder="Код комнаты" maxlength="8"><button class="btn ghost">Присоединиться</button></form>
 <p class="err" id="homeErr" role="status"></p>
</main>
<div id="room" class="room" hidden>
 <header><div class="logo"><i>❤</i>ILOVEZHANIYA</div><span class="pill" id="pill"></span></header>
 <div class="bar"><b id="codeLbl"></b><button class="btn ghost sm" id="copy">Копировать ссылку</button><button class="btn ghost sm" id="leave"></button></div>
 <div id="players"></div>
 <p class="muted" id="peerBuf" hidden>Собеседник загружает видео, пауза до его готовности</p>
 <video id="vid" controls playsinline></video><div id="ytwrap" hidden></div>
 <p class="muted" id="empty"></p><p class="err" id="err"></p>
 <div class="bar"><select id="quality" hidden></select><span class="muted">Рассинхрон: <span id="drift">—</span></span></div>
 <form class="row" id="src" hidden><input id="url" placeholder="Ссылка: MP4, WebM, M3U8 или YouTube"><button class="btn primary">Включить</button></form>
 <div class="bar" id="upBar" hidden><label class="btn ghost sm" for="file">📁 Загрузить свой файл</label><input type="file" id="file" accept="video/mp4,video/webm,.mp4,.webm" hidden><span class="muted" id="upState"></span></div>
 <div class="bar"><button class="btn ghost sm" id="mic">🎙 Включить микрофон</button><span class="muted" id="voice">Голос не подключён</span></div>
 <p class="err" id="vErr"></p><audio id="aud" autoplay></audio>
 <button class="btn ghost sm" id="chatToggle">Скрыть чат</button>
 <div class="chat" id="chat"><div id="log"></div><form class="row" id="chatForm"><input id="msg" placeholder="Сообщение" maxlength="500" autocomplete="off"><button class="btn primary">Отправить</button></form></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);
if(typeof io==='undefined'){$('#homeErr').textContent='Нет связи с сервером. Откройте адрес вашего запущенного сервера (Repl), а не сам файл watch.html.';throw new Error('socket.io не загружен')}
const socket=io(),vid=$('#vid');
const pid=localStorage.getItem('pid')||(()=>{const v=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('pid',v);return v})();
let offset=0,code='',name='',admin=false,st=null,curUrl='',ytId=null,yt=null,hlsI=null,needInit=false,autoPaused=false;
let pc=null,mic=null,making=false,ignore=false,rtt=0,online=false,members=[];
const target=s=>s.playing?s.pos+(Date.now()+offset-s.ts)/1000*s.rate:s.pos;
const showErr=t=>{$('#err').textContent=t||''};
function sync(){const t0=Date.now();socket.emit('time',{},s=>{offset=s+(Date.now()-t0)/2-Date.now()})}
function ytIdOf(u){try{const x=new URL(u),h=x.hostname.replace(/^www\.|^m\./,'');let v=null;
 if(h==='youtu.be')v=x.pathname.slice(1,12);
 else if(h==='youtube.com'){const m=x.pathname.match(/^\/(?:embed|shorts)\/([\w-]{11})/);v=x.searchParams.get('v')||(m&&m[1])}
 return v&&/^[\w-]{11}$/.test(v)?v:null}catch(e){return null}}
function ytReady(){return new Promise(res=>{if(window.YT&&YT.Player)return res();const prev=window.onYouTubeIframeAPIReady;
 window.onYouTubeIframeAPIReady=()=>{if(prev)prev();res()};
 if(!$('#yt-api')){const s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)}})}

// единый интерфейс: HTML5 video или YouTube
function A(){
 if(ytId){const y=yt;if(!y||!y.getCurrentTime)return null;
  return{t:()=>y.getCurrentTime(),paused:()=>![1,3].includes(y.getPlayerState()),seek:x=>y.seekTo(x,true),
   play:()=>{y.playVideo();return Promise.resolve()},pause:()=>y.pauseVideo(),rate:()=>y.getPlaybackRate(),setRate:r=>y.setPlaybackRate(r)}}
 return{t:()=>vid.currentTime,paused:()=>vid.paused,seek:x=>{vid.currentTime=x},play:()=>vid.play(),pause:()=>vid.pause(),
  rate:()=>vid.playbackRate,setRate:r=>{vid.playbackRate=r}}}
function ctl(type){const a=A();if(admin&&a)socket.emit('ctl',{type,pos:a.t(),rate:a.rate()})}
function apply(){const a=A();if(!a||!st||!st.url)return;if(admin&&!needInit)return;needInit=false;
 const t=target(st),d=a.t()-t;$('#drift').textContent=admin?'—':d.toFixed(2)+' с';
 if(Math.abs(d)>0.8)a.seek(t);
 const r=st.playing&&Math.abs(d)>0.15&&Math.abs(d)<=0.8?st.rate*(d>0?0.95:1.05):st.rate;
 if(Math.abs(a.rate()-r)>0.001)a.setRate(r);
 if(st.playing&&a.paused())a.play().catch(()=>showErr('Нажмите ▶, чтобы разрешить воспроизведение'));
 if(!st.playing&&!a.paused())a.pause()}
setInterval(apply,2000);
(()=>{let last=0,lt=Date.now();setInterval(()=>{const a=A();if(!a||!admin||!ytId)return; // перемотка в YouTube у администратора
 const t=a.t(),exp=last+(a.paused()?0:(Date.now()-lt)/1000*a.rate());if(Math.abs(t-exp)>1.5)ctl('seek');last=t;lt=Date.now()},1000)})();

function setState(s){st=s;loadSource();apply()}
function loadSource(){
 if(!st||st.url===curUrl)return;curUrl=st.url;showErr('');
 if(hlsI){hlsI.destroy();hlsI=null}$('#quality').hidden=true;
 if(yt&&yt.destroy)yt.destroy();yt=null;$('#ytwrap').innerHTML='';
 ytId=st.url?ytIdOf(st.url):null;needInit=true;
 vid.hidden=!!ytId;$('#ytwrap').hidden=!ytId;$('#empty').hidden=!!st.url;
 if(!st.url){vid.removeAttribute('src');vid.load();return}
 if(ytId)return startYt();
 if(/\.m3u8(\?|$)/i.test(st.url)&&window.Hls&&Hls.isSupported()){
  const h=new Hls();hlsI=h;h.loadSource(st.url);h.attachMedia(vid);
  h.on(Hls.Events.MANIFEST_PARSED,()=>{const hs=h.levels.map(l=>l.height);let cap=-1;
   hs.forEach((x,i)=>{if(x<=720&&(cap<0||x>hs[cap]))cap=i});h.autoLevelCapping=cap; // авто, но не выше 720p
   const q=$('#quality');q.innerHTML='<option value="-1">Авто (до 720p)</option>';
   hs.forEach((x,i)=>{if(x<=720){const o=document.createElement('option');o.value=i;o.textContent=x+'p';q.append(o)}});q.hidden=hs.length<2});
  h.on(Hls.Events.ERROR,(_e,d)=>{if(d.fatal)showErr('Не удалось загрузить поток. Возможно, источник запрещает встраивание')});
 }else vid.src=st.url}
function startYt(){vid.pause();ytReady().then(()=>{if(!ytId)return;const d=document.createElement('div');$('#ytwrap').appendChild(d);
 yt=new YT.Player(d,{videoId:ytId,playerVars:{controls:admin?1:0,playsinline:1,rel:0,disablekb:admin?0:1},events:{
  onReady:()=>{needInit=true;apply()},
  onStateChange:e=>{if(admin){if(e.data===1)ctl('play');else if(e.data===2)ctl('pause')}else{socket.emit('buffer',{b:e.data===3});apply()}},
  onError:()=>showErr('YouTube не разрешает воспроизвести это видео во встроенном плеере')}})})}
$('#quality').onchange=e=>{if(hlsI)hlsI.currentLevel=+e.target.value};
vid.addEventListener('loadedmetadata',()=>{needInit=true;apply()});
vid.addEventListener('play',()=>admin?ctl('play'):apply());
vid.addEventListener('pause',()=>admin?ctl('pause'):apply());
vid.addEventListener('seeked',()=>admin?ctl('seek'):apply());
vid.addEventListener('ratechange',()=>{if(admin)ctl('rate')});
vid.addEventListener('waiting',()=>{if(!admin)socket.emit('buffer',{b:true})});
['playing','canplay'].forEach(ev=>vid.addEventListener(ev,()=>{if(!admin)socket.emit('buffer',{b:false})}));
vid.addEventListener('error',()=>{if(st&&st.url&&!ytId)showErr('Не удалось воспроизвести: проверьте ссылку или формат (MP4, WebM, HLS)')});

// комната, участники, статус
function renderStatus(){const p=$('#pill');p.className='pill '+(online&&rtt<=400?'ok':'bad');
 p.textContent=!online?'Переподключение…':'Связь: '+(rtt<150?'хорошая':rtt<400?'средняя':'слабая')+(rtt?' · '+rtt+' мс':'')}
function renderMembers(){const box=$('#players');box.innerHTML='';
 members.forEach(m=>{const s=document.createElement('span'),i=document.createElement('i');i.className='dot'+(m.online?' on':'');s.append(i,m.name+(m.admin?' (админ)':''));box.append(s)});
 if(members.length<2){const s=document.createElement('span');s.className='muted';s.textContent='Ждём второго участника';box.append(s)}
 const two=members.filter(m=>m.online).length>1;if(!two&&pc)closePc();if(two&&mic&&!pc)makePc()}
function addMsg(m){const p=document.createElement('p'),b=document.createElement('b'),sm=document.createElement('small');
 b.textContent=m.name;sm.textContent=' '+new Date(m.t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
 p.append(b,sm,document.createElement('br'),document.createTextNode(m.text));const l=$('#log');l.append(p);l.scrollTop=l.scrollHeight}
function doJoin(){socket.emit('join',{code,name,pid},r=>{
 if(!r.ok)return showHome(r.error);
 admin=r.admin;members=r.members;renderMembers();$('#log').innerHTML='';r.msgs.forEach(addMsg);
 offset=r.now-Date.now();sync();$('#src').hidden=!admin;$('#upBar').hidden=!admin;$('#leave').textContent=admin?'Закрыть':'Выйти';
 $('#empty').textContent=admin?'Вставьте ссылку на видео ниже':'Администратор ещё не выбрал видео';
 curUrl='\u0000';setState(r.state)})}
function enter(c){name=$('#name').value.trim();if(!name)return $('#homeErr').textContent='Введите имя';
 if(!socket.connected)return $('#homeErr').textContent='Нет связи с сервером. Подождите пару секунд или обновите страницу';
 localStorage.setItem('name',name);code=c;location.hash=c;$('#codeLbl').textContent='Код: '+c;
 $('#home').hidden=true;$('#room').hidden=false;if(socket.connected)doJoin()}
function showHome(msg){code='';location.hash='';if(mic){mic.getTracks().forEach(t=>t.stop());mic=null}closePc();
 if(yt&&yt.destroy)yt.destroy();yt=null;ytId=null;vid.pause();vid.removeAttribute('src');curUrl='';st=null;admin=false;
 $('#mic').textContent='🎙 Включить микрофон';$('#room').hidden=true;$('#home').hidden=false;$('#homeErr').textContent=msg||''}
$('#create').onclick=()=>{if(!$('#name').value.trim())return $('#homeErr').textContent='Введите имя';
 if(!socket.connected)return $('#homeErr').textContent='Нет связи с сервером. Подождите пару секунд или обновите страницу';
 socket.emit('create',{pid},r=>r.ok?enter(r.code):$('#homeErr').textContent='Не удалось создать комнату')};
$('#joinForm').onsubmit=e=>{e.preventDefault();const c=$('#code').value.trim().toUpperCase();c?enter(c):$('#homeErr').textContent='Введите код комнаты'};
$('#copy').onclick=()=>{const l=location.origin+'/#'+code;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).catch(()=>prompt('Скопируйте ссылку:',l))};
$('#leave').onclick=()=>{socket.emit(admin?'close':'leave');showHome('')};
$('#src').onsubmit=e=>{e.preventDefault();socket.emit('source',{url:$('#url').value},r=>showErr(r.ok?'':r.error))};
$('#chatForm').onsubmit=e=>{e.preventDefault();const v=$('#msg').value.trim();if(v)socket.emit('chat',{text:v});$('#msg').value=''};
$('#chatToggle').onclick=()=>{const c=$('#chat');c.hidden=!c.hidden;$('#chatToggle').textContent=c.hidden?'Показать чат':'Скрыть чат'};
$('#name').value=localStorage.getItem('name')||'';$('#code').value=location.hash.slice(1).toUpperCase();
setInterval(()=>{const t0=Date.now();socket.emit('time',{},()=>{rtt=Date.now()-t0;renderStatus()})},5000);

socket.on('connect_error',()=>{if(!code)$('#homeErr').textContent='Нет связи с сервером…'});
socket.on('connect',()=>{if(!code)$('#homeErr').textContent='';online=true;sync();renderStatus();if(code)doJoin()});
socket.on('disconnect',()=>{online=false;renderStatus()});
socket.on('room',m=>{members=m;renderMembers()});
socket.on('state',setState);
socket.on('chat',addMsg);
socket.on('closed',()=>showHome('Комната закрыта'));
socket.on('buffer',m=>{$('#peerBuf').hidden=!m.b;const a=A();if(!admin||!a)return;
 if(m.b&&!a.paused()&&st&&st.playing){autoPaused=true;a.pause()}else if(!m.b&&autoPaused){autoPaused=false;a.play().catch(()=>{})}});

// загрузка своего файла (MP4/WebM) на сервер комнаты
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 if(!/\.(mp4|webm)$/i.test(f.name))return showErr('Поддерживаются только MP4 и WebM');
 const x=new XMLHttpRequest(),up=$('#upState');showErr('');
 x.open('POST','/upload?code='+encodeURIComponent(code)+'&pid='+encodeURIComponent(pid));
 x.upload.onprogress=ev=>{if(ev.lengthComputable)up.textContent='Загрузка: '+Math.round(ev.loaded/ev.total*100)+'%'};
 x.onload=()=>{let r={};try{r=JSON.parse(x.responseText)}catch(_){}up.textContent=r.ok?'Файл загружен':'';showErr(r.ok?'':(r.error||'Не удалось загрузить файл'))};
 x.onerror=()=>{up.textContent='';showErr('Загрузка прервана')};
 x.send(f)};

// голос (WebRTC, «идеальное согласование»: гость — вежливая сторона)
function makePc(){if(pc)return pc;
 const p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 p.onicecandidate=e=>{if(e.candidate)socket.emit('signal',{c:e.candidate})};
 p.ontrack=e=>{$('#aud').srcObject=e.streams[0];$('#aud').play().catch(()=>{});$('#voice').textContent='Голосовая связь установлена'};
 p.onnegotiationneeded=async()=>{try{making=true;await p.setLocalDescription();socket.emit('signal',{d:p.localDescription})}catch(e){}finally{making=false}};
 p.onconnectionstatechange=()=>{if(p.connectionState==='failed')$('#vErr').textContent='Голос не удалось соединить. Выключите и включите микрофон'};
 if(mic)mic.getTracks().forEach(t=>p.addTrack(t,mic));
 pc=p;return p}
function closePc(){if(pc){pc.close();pc=null}$('#voice').textContent='Голос не подключён'}
async function onSignal(m){const p=makePc();
 try{if(m.d){const collision=m.d.type==='offer'&&(making||p.signalingState!=='stable');
   ignore=admin?collision:false;if(ignore)return;
   await p.setRemoteDescription(m.d);
   if(m.d.type==='offer'){await p.setLocalDescription();socket.emit('signal',{d:p.localDescription})}}
  else if(m.c){try{await p.addIceCandidate(m.c)}catch(e){if(!ignore)throw e}}}catch(e){}}
socket.on('signal',onSignal);
$('#mic').onclick=async()=>{$('#vErr').textContent='';
 if(mic){const t=mic.getAudioTracks()[0];t.enabled=!t.enabled;$('#mic').textContent=t.enabled?'🎙 Микрофон включён':'🎙 Микрофон выключен';return}
 try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  $('#mic').textContent='🎙 Микрофон включён';if(members.filter(m=>m.online).length>1)makePc()}
 catch(e){$('#vErr').textContent='Нет доступа к микрофону. Разрешите его в настройках браузера (нужен HTTPS)'}};
</script></body></html>
